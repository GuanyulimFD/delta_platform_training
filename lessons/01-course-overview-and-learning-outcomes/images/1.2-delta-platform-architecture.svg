<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 710" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowCtrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f3d61"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="710" fill="#ffffff"/>

  <text x="700" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Delta Platform — Architecture at a Glance</text>

  <!-- Control banner -->
  <rect x="60" y="50" width="1280" height="80" rx="14" fill="#0f3d61"/>
  <text x="700" y="84" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">KX CONTROL</text>
  <text x="700" y="108" text-anchor="middle" font-size="13" fill="#cbd5e1">Single point of access — configure, deploy &amp; monitor every process below</text>
  <text x="1320" y="108" text-anchor="end" font-size="11" fill="#93c5fd">Modules 2 &amp; 3</text>

  <!-- dashed arrows from control down to container -->
  <line x1="250" y1="130" x2="250" y2="168" stroke="#0f3d61" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowCtrl)"/>
  <line x1="700" y1="130" x2="700" y2="168" stroke="#0f3d61" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowCtrl)"/>
  <line x1="1050" y1="130" x2="1050" y2="168" stroke="#0f3d61" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowCtrl)"/>

  <!-- Package container -->
  <rect x="60" y="170" width="1080" height="440" rx="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="80" y="156" width="160" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="160" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">PACKAGE</text>
  <text x="600" y="205" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">Everything below is built from reusable Process Templates → Instances → Tasks → Workflows, versioned together as one package</text>

  <!-- Lane A: real-time -->
  <rect x="100" y="280" width="150" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Market / Event</text>
  <text x="175" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Feed (external)</text>

  <rect x="300" y="280" width="140" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="370" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Tickerplant</text>
  <text x="370" y="338" text-anchor="middle" font-size="12" fill="#312e81">(TP)</text>
  <text x="370" y="360" text-anchor="middle" font-size="11" fill="#6366f1">Module 4</text>

  <rect x="490" y="280" width="160" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="570" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Messaging</text>
  <text x="570" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Server</text>
  <text x="570" y="360" text-anchor="middle" font-size="11" fill="#6366f1">Module 6</text>

  <rect x="700" y="220" width="140" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="770" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">RDB</text>
  <text x="770" y="274" text-anchor="middle" font-size="11" fill="#065f46">today · in-memory</text>
  <text x="770" y="292" text-anchor="middle" font-size="11" fill="#059669">Module 4</text>

  <rect x="700" y="400" width="140" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="770" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">HDB</text>
  <text x="770" y="454" text-anchor="middle" font-size="11" fill="#065f46">history · on-disk</text>
  <text x="770" y="472" text-anchor="middle" font-size="11" fill="#059669">Module 4</text>

  <rect x="900" y="280" width="150" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="975" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Gateway</text>
  <text x="975" y="338" text-anchor="middle" font-size="11" fill="#9a3412">query router</text>
  <text x="975" y="360" text-anchor="middle" font-size="11" fill="#ea580c">Module 8</text>

  <!-- Lane B: batch -->
  <rect x="100" y="490" width="150" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Vendor File</text>
  <text x="175" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">(CSV / JSON)</text>

  <rect x="300" y="490" width="140" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="370" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">FileWatcher</text>
  <text x="370" y="560" text-anchor="middle" font-size="11" fill="#6366f1">Module 5</text>

  <!-- Client -->
  <rect x="1180" y="300" width="160" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1260" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Client /</text>
  <text x="1260" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Dashboard</text>

  <!-- Arrows -->
  <line x1="250" y1="325" x2="300" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="325" x2="490" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="305" x2="700" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="300" x2="770" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792" y="354" font-size="10" font-style="italic" fill="#059669">EOD</text>
  <line x1="250" y1="535" x2="300" y2="535" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="530" x2="700" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="260" x2="900" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="440" x2="900" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="325" x2="1180" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="100" y="645" width="16" height="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="124" y="658" font-size="12" fill="#334155">Process (from a template)</text>
  <rect x="330" y="645" width="16" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="354" y="658" font-size="12" fill="#334155">Database tier</text>
  <rect x="480" y="645" width="16" height="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="504" y="658" font-size="12" fill="#334155">Query layer</text>
  <rect x="610" y="645" width="16" height="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="634" y="658" font-size="12" fill="#334155">External to the platform</text>
</svg>
